name: Build proof PDFs

on:
  push:
    paths:
      - 'docs/proofs/**/paper.tex'
      - '.github/workflows/build-proof-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install XeLaTeX and CJK support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk poppler-utils

      - name: Build all proof PDFs
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tex; do
            dir="$(dirname "$tex")"
            echo "Building $tex"
            (
              cd "$dir"
              xelatex -interaction=nonstopmode -halt-on-error paper.tex
              xelatex -interaction=nonstopmode -halt-on-error paper.tex
              pdfinfo paper.pdf | grep -E '^(Pages|Page size):'
              test -s paper.pdf
              rm -f paper.aux paper.log paper.out paper.toc
            )
          done < <(find docs/proofs -name paper.tex -print | sort)

      - name: Commit generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find docs/proofs -name paper.pdf -print0 | xargs -0 git add
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "docs: rebuild audited proof PDFs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
