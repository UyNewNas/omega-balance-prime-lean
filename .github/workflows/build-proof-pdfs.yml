name: Build proof PDFs

on:
  push:
    paths:
      - 'docs/proofs/**/paper.tex'
      - '.github/workflows/build-proof-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Select proof PDFs to build
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/proof-tex-files
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            find docs/proofs -name paper.tex -print | sort > /tmp/proof-tex-files
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              find docs/proofs -name paper.tex -print | sort > /tmp/proof-tex-files
            else
              git diff --name-only "$before" "${GITHUB_SHA}" -- 'docs/proofs/**/paper.tex'                 | sort -u > /tmp/proof-tex-files
            fi
          fi
          echo "Selected sources:"
          cat /tmp/proof-tex-files

      - name: Install XeLaTeX and CJK support
        run: |
          if [[ ! -s /tmp/proof-tex-files ]]; then
            echo "No proof PDFs need rebuilding."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk poppler-utils

      - name: Build changed proof PDFs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/proof-tex-files ]]; then
            echo "No changed paper.tex files."
            exit 0
          fi
          while IFS= read -r tex; do
            dir="$(dirname "$tex")"
            echo "Building $tex"
            (
              cd "$dir"
              xelatex -interaction=nonstopmode -halt-on-error paper.tex
              xelatex -interaction=nonstopmode -halt-on-error paper.tex
              pdfinfo paper.pdf | grep -E '^(Pages|Page size):'
              test -s paper.pdf
              render_dir="$(mktemp -d)"
              pdftoppm -png -r 120 paper.pdf "$render_dir/page" >/dev/null
              test -n "$(find "$render_dir" -name 'page-*.png' -print -quit)"
              rm -rf "$render_dir"
              rm -f paper.aux paper.log paper.out paper.toc
            )
          done < /tmp/proof-tex-files

      - name: Commit generated PDFs
        # The protected default branch requires a PR. Build/render there, but
        # write regenerated binaries back only to non-default work branches.
        # An absent default_branch or a tag fails closed for writeback.
        if: ${{ github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/proof-tex-files ]]; then
            echo "No PDF changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r tex; do
            git add "${tex%.tex}.pdf"
          done < /tmp/proof-tex-files
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "docs: rebuild audited proof PDFs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
