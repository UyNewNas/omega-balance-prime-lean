name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
      - name: Fetch pinned dependencies and cache
        run: |
          lake update
          lake exe cache get
      - name: Build library
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Kernel regression tests
        shell: bash
        run: |
          set -o pipefail
          lake build OmegaBalance.Examples OmegaBalance.F3Examples OmegaBalance.F3DeeperExamples 2>&1 | tee examples.log
      - name: Audit axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/Audit.lean 2>&1 | tee axioms.log
          python3 scripts/check_axioms.py axioms.log
      - name: Audit source and declaration coverage
        run: |
          python3 scripts/check_sources.py
          python3 scripts/check_audit_coverage.py
      - name: Finite F3 checks and distribution
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/f3_corollaries_verify.py --limit 10000000 2>&1 | tee f3.log
          python3 scripts/test_f3_corollaries.py 2>&1 | tee f3-boundaries.log
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification
          path: |
            build.log
            examples.log
            axioms.log
            f3.log
            f3-boundaries.log
            lake-manifest.json
          if-no-files-found: ignore
